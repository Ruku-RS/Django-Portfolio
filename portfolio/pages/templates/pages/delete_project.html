{% extends "pages/base.html" %}

{% block title %}
Delete Project
{% endblock %}

{% block content %}

<h1>Delete Project</h1>

<p>
    Are you sure you want to delete
    <strong>{{ project.title }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<a href="{% url 'projects' %}">
    Cancel
</a>

{% endblock %}
