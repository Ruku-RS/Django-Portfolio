{% extends "pages/base.html"%}
{% load static %}

{% block title %}
Projects
{% endblock title %}


{% block content%}

<h2>My Projects </h2>
{% for project in projects %}
<div class='project'>
    <h3>{{project.title}}</h3>
    <p>{{project.description}}</p>
    <a href="{{project.github_link}}" target="_blank">GitHub Repository</a>
    <p>Created at: {{project.created_at}}</p>
</div>
<hr>
{% endfor %}

{%endblock%}
