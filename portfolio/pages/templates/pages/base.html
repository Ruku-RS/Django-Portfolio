{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title> 
        {% block title %}
        Portfolio
        {% endblock  %}
    </title>
    <link rel='stylesheet' href="{% static 'pages/css/style.css' %}">
</head>
<body>
    <header>
        <h1>Rukman's Portfolio</h1>
    </header>

    <nav>
        |<a href= "{% url 'home' %}">Home</a>|
        <a href= "{% url 'about' %}">About</a>|
        <a href= "{% url 'projects' %}">Projects</a>|
        <a href= "{% url 'contacts' %}">Contact</a>|
        <a href= "{% url 'skills' %}">Skills</a>|
    </nav>
    <hr>

    <!--Flash messages-->
    {% if messages %}
        {%for message in messages %}
            <div class="messgae {{message.tags}}">
                {{message}}
            </div>
        {%endfor%}
    {%endif%}

    {% block content %}
    {% endblock %}
    <hr>

    <footer>
        © 2026 My Portfolio
    </footer>
</body>
</html>
