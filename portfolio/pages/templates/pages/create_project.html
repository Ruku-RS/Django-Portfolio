{% extends "pages/base.html" %}

{% block title %}
Create Project
{% endblock %}

{% block content %}

<h1>Create Project</h1>

<form method="POST" enctype='multipart/form-data'>
    {% csrf_token %}
    {{form.as_p}}
    <button type="submit">
        Create Project
    </button>
</form>
<a href="{% url 'projects' %}" class='cancel-btn'>
    Cancel
</a>

{% endblock %}
