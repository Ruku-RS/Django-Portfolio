{% extends "pages/base.html" %}

{% block title %}
    Edit Project
{% endblock %}

{% block content %}

<h1>Edit Project</h1>

<form method="POST" enctype='multipart/form-data'>

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Changes
    </button>

</form>

<a href="{% url 'projects' %}">
    Cancel
</a>

{% endblock %}
