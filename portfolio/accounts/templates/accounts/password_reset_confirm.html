{% extends "pages/base.html" %}

{% block title %}
Set New Password
{% endblock %}

{% block content %}

<h2>Set New Password</h2>

{% if validlink %}

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Change Password
    </button>

</form>

{% else %}

<p>The reset link is invalid or has expired.</p>

{% endif %}

{% endblock %}
