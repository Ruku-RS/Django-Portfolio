{% extends "pages/base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<h2>Forgot Your Password?</h2>

<p>
    Enter your email address and we'll send you
    a password reset link.
</p>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Send Reset Link
    </button>

</form>

{% endblock %}
